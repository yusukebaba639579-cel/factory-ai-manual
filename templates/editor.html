<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>編集 | {{ video.title }}</title><link rel="stylesheet" href="/static/style.css"></head><body class="workspace"><aside class="steps"><a class="brand" href="/"><i>f</i><b>factory-ai-manual</b></a><div class="step-head"><span>作業一覧</span><small>{{ processes|length }}作業</small></div><div id="step-list">{% for p in processes %}<button class="step" data-id="{{ p.id }}" data-start="{{ p.start_time }}" data-end="{{ p.end_time }}"><em>{{ loop.index }}</em><div><b>{{ p.title }}</b><small>{{ '%.1f'|format(p.end_time-p.start_time) }}秒</small><p>{{ p.description_ja }}</p></div></button>{% endfor %}</div></aside><main class="editor"><header><div><p class="eyebrow">MANUAL EDITOR</p><h1>{{ video.title }}</h1></div><a class="primary link" href="/manuals/{{ video.id }}">閲覧画面を開く</a></header><section class="player"><video id="video" controls class="{% if video.rotation == 180 %}rotated-video{% endif %}" src="/api/videos/{{ video.id }}/stream"></video><div id="caption"></div></section><section class="timeline"><div><b>作業を追加</b><p>動画の現在位置を開始・終了として記録します。</p></div><div class="marks"><button id="mark-start">開始位置を記録</button><output id="start-output">未指定</output><button id="mark-end">終了位置を記録</button><output id="end-output">未指定</output></div><select id="process-title"><option>ねじ締め</option><option>ねじの締付確認</option><option>不適合確認</option><option>判定保留</option></select><button id="add-process" class="primary">作業を追加</button></section><section id="details" class="details" hidden><div><label>作業ラベル<select id="edit-title"><option>ねじ締め</option><option>ねじの締付確認</option><option>不適合確認</option><option>判定保留</option></select></label><label>説明文<textarea id="edit-description" rows="4" maxlength="30"></textarea></label><p class="learning-note">正しい作業ラベルで保存すると、次回以降の自動判定に学習されます。</p></div><div class="actions"><button id="ai" class="outline">Ollamaで説明文生成</button><button id="delete" class="danger">削除</button><button id="save" class="primary">保存して学習</button></div></section></main><div id="toast"></div><script>window.MANUAL_ID={{ video.id }};</script><script src="/static/editor.js"></script></body></html>
